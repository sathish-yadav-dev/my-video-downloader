<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATHISH YADAV | Pro Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0b0f19; color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #161d2f; padding: 35px; border-radius: 25px; text-align: center; width: 88%; max-width: 380px; border: 1px solid #2e3a59; box-shadow: 0 15px 40px rgba(0,0,0,0.6); }
        
        .name-badge { font-size: 11px; font-weight: 800; background: #4f46e5; padding: 5px 15px; border-radius: 50px; display: inline-block; margin-bottom: 12px; letter-spacing: 2px; text-transform: uppercase; }
        .social-icons { font-size: 20px; margin-bottom: 10px; display: flex; justify-content: center; gap: 20px; }
        .fa-instagram { color: #e1306c; } .fa-youtube { color: #ff0000; }
        .title { font-size: 24px; font-weight: 900; color: #fff; margin-bottom: 30px; letter-spacing: 1px; }

        input { width: 100%; padding: 18px; border-radius: 12px; border: 2px solid #2e3a59; background: #0b0f19; color: white; margin-bottom: 25px; box-sizing: border-box; font-size: 15px; outline: none; transition: 0.3s; }
        input:focus { border-color: #4f46e5; }

        /* ఆడియో/వీడియో బటన్లు */
        .btn-group { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 18px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; color: white; transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        
        .video-btn { background: linear-gradient(45deg, #4f46e5, #3b82f6); }
        .audio-btn { background: linear-gradient(45deg, #10b981, #059669); }
        .btn:active { transform: scale(0.95); }
        .btn i { font-size: 20px; }
        .btn span { font-size: 12px; }

        .footer { margin-top: 35px; font-size: 10px; color: #94a3b8; opacity: 0.4; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="name-badge">SATHISH YADAV</div>
        <div class="social-icons">
            <i class="fab fa-instagram"></i>
            <i class="fab fa-youtube"></i>
        </div>
        <div class="title">PRO DOWNLOADER</div>
        
        <input type="text" id="vUrl" placeholder="Paste link here...">
        
        <div class="btn-group">
            <button class="btn video-btn" onclick="go('video')">
                <i class="fas fa-video"></i>
                <span>DOWNLOAD VIDEO</span>
            </button>
            
            <button class="btn audio-btn" onclick="go('audio')">
                <i class="fas fa-music"></i>
                <span>DOWNLOAD AUDIO</span>
            </button>
        </div>
        
        <div class="footer">SATHISH SERVER v13.0 • FAST & NEET</div>
    </div>

    <script>
        function go(type) {
            let u = document.getElementById('vUrl').value.trim();
            if(!u) { alert("Please paste a link first!"); return; }

            // ఈ ట్రిక్ ద్వారా కోబాల్ట్ సర్వర్ లో లింక్ ఆటోమేటిక్ గా పేస్ట్ అవుతుంది
            let finalUrl = "https://cobalt.tools/?url=" + encodeURIComponent(u);
            
            // ఒకవేళ ఆడియో అయితే ఆడియో మోడ్ లో ఓపెన్ అవుతుంది
            if(type === 'audio') {
                finalUrl += "&isAudioOnly=true";
            }

            // ఇది ఫోన్ లో చాలా ఫాస్ట్ గా పనిచేస్తుంది
            window.location.href = finalUrl;
        }
    </script>

</body>
</html>
