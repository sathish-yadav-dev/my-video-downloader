<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sathish Video Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 380px; border: 1px solid #334155; }
        h1 { color: #3b82f6; }
        .social-icons { margin: 20px 0; font-size: 30px; display: flex; justify-content: center; gap: 15px; }
        .fa-youtube { color: #ff0000; } .fa-instagram { color: #e1306c; } .fa-facebook { color: #1877f2; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #334155; background: #0f172a; color: white; margin-bottom: 20px; box-sizing: border-box; font-size: 16px; }
        .btn { background: #3b82f6; color: white; padding: 15px; border-radius: 10px; border: none; width: 100%; font-weight: bold; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎥 Pro Downloader</h1>
        <div class="social-icons">
            <i class="fab fa-youtube"></i> <i class="fab fa-instagram"></i> <i class="fab fa-facebook"></i>
        </div>
        <input type="text" id="link" placeholder="Paste video link here...">
        <button class="btn" onclick="start()">Download Now</button>
        <p id="msg" style="margin-top:15px; font-size:12px; opacity:0.6;"></p>
    </div>

    <script>
        function start() {
            let u = document.getElementById('link').value;
            if(!u) { alert("Please paste a link!"); return; }
            
            document.getElementById('msg').innerText = "🚀 Redirecting...";
            
            // ఇది ఏ మొబైల్ బ్రౌజర్ లోనైనా నేరుగా రీడైరెక్ట్ చేస్తుంది
            window.location.replace("https://savefrom.net/?url=" + encodeURIComponent(u));
        }
    </script>
</body>
</html>
