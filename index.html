<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sathish Yadav - High Speed Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 380px; border: 1px solid #334155; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        h1 { color: #3b82f6; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: white; margin-bottom: 20px; box-sizing: border-box; font-size: 16px; outline: none; }
        .dl-button { display: block; background: #10b981; color: white; padding: 16px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 18px; transition: 0.3s; }
        .dl-button:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Insta & YT Pro</h1>
        <div style="font-size: 30px; margin-bottom: 20px;">
            <i class="fab fa-instagram" style="color: #e1306c;"></i> 
            <i class="fab fa-youtube" style="color: #ff0000; margin-left: 15px;"></i>
        </div>
        
        <input type="text" id="vUrl" placeholder="Paste video link here..." oninput="update()">
        
        <a href="javascript:void(0)" id="mainBtn" class="dl-button" onclick="validate()">Download Now</a>
        
        <p id="msg" style="margin-top: 15px; font-size: 12px; opacity: 0.6;">Enter link to start</p>
    </div>

    <script>
        function update() {
            let u = document.getElementById('vUrl').value;
            let btn = document.getElementById('mainBtn');
            if(u.trim() !== "") {
                // ఇది SnapInsta సర్వర్ - ఇన్స్టాగ్రామ్ కోసం బెస్ట్
                btn.href = "https://snapinsta.app/?url=" + encodeURIComponent(u);
                document.getElementById('msg').innerText = "✅ Server Ready!";
            }
        }
        function validate() {
            let u = document.getElementById('vUrl').value;
            if(!u) { alert("Please paste a link first!"); }
        }
    </script>
</body>
</html>
