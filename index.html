<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sathish's Super Downloader</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 40px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; width: 90%; max-width: 400px; border: 1px solid #334155; }
        h1 { background: linear-gradient(to right, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 28px; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: white; margin: 20px 0; box-sizing: border-box; outline: none; }
        button { background: #3b82f6; color: white; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; }
        #status { margin-top: 20px; color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎥 Downloader</h1>
        <p>Paste link & hit Download</p>
        <input type="text" id="vUrl" placeholder="Paste link here...">
        <button onclick="start()">Download Now</button>
        <div id="status"></div>
    </div>
    <script>
        function start() {
            let url = document.getElementById('vUrl').value;
            let status = document.getElementById('status');
            if(!url) { status.innerText = "❌ Please paste a link!"; return; }
            
            status.innerHTML = "🚀 Redirecting to Download Server...";
            
            // window.open కి బదులు నేరుగా వెళ్ళడానికి ఇది వాడదాం
            setTimeout(() => {
                window.location.href = "https://savefrom.net/?url=" + encodeURIComponent(url);
            }, 1000);
        }
    </script>
</body>
</html>
