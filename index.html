<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATHISH YADAV | Pro Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0b1120; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 380px; border: 1px solid #334155; }
        .name-badge { font-size: 10px; font-weight: bold; background: #4f46e5; padding: 5px 15px; border-radius: 50px; display: inline-block; margin-bottom: 12px; letter-spacing: 2px; text-transform: uppercase; }
        .social-icons { font-size: 20px; margin-bottom: 10px; display: flex; justify-content: center; gap: 15px; }
        .fa-instagram { color: #e1306c; } .fa-youtube { color: #ff0000; }
        .title { font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 30px; }
        input { width: 100%; padding: 18px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 25px; box-sizing: border-box; outline: none; }
        .dl-btn { background: #4f46e5; color: white; padding: 18px; border: none; border-radius: 15px; width: 100%; font-weight: bold; cursor: pointer; font-size: 16px; box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3); }
        .footer { margin-top: 30px; font-size: 10px; opacity: 0.3; }
    </style>
</head>
<body>

    <div class="card">
        <div class="name-badge">SATHISH YADAV</div>
        <div class="social-icons">
            <i class="fab fa-instagram"></i> <i class="fab fa-youtube"></i>
        </div>
        <div class="title">PRO DOWNLOADER</div>
        
        <input type="text" id="vUrl" placeholder="Paste Instagram/YouTube Link...">
        <button class="dl-btn" onclick="goDownload()">🚀 DOWNLOAD NOW</button>

        <div class="footer">STABLE SYSTEM • v20.0</div>
    </div>

    <script>
        function goDownload() {
            let link = document.getElementById('vUrl').value.trim();
            if(!link) { alert("Please paste a link!"); return; }

            // ఇది ప్రపంచంలోనే అత్యంత నమ్మకమైన 'ss' ట్రిక్
            // ఇది 403 Forbidden ఎర్రర్ రాకుండా సర్వర్ ని బైపాస్ చేస్తుంది
            let finalUrl = "https://sfrom.net/" + link;
            
            // ఫోన్ లో చాలా ఫాస్ట్ గా ఓపెన్ అవుతుంది
            window.location.href = finalUrl;
        }
    </script>

</body>
</html>
