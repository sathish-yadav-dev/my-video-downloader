<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sathish Pro Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 400px; border: 1px solid #334155; }
        h1 { color: #3b82f6; }
        .social-icons { margin: 20px 0; font-size: 25px; display: flex; justify-content: center; gap: 15px; }
        input { width: 100%; padding: 15px; border-radius: 10px; border: 2px solid #334155; background: #0f172a; color: white; margin-bottom: 20px; box-sizing: border-box; }
        .btn { background: #3b82f6; color: white; padding: 15px; border-radius: 10px; width: 100%; font-weight: bold; border: none; cursor: pointer; display: block; text-decoration: none; }
        #resultArea { display: none; margin-top: 20px; padding: 15px; border: 1px dashed #3b82f6; border-radius: 10px; background: rgba(59, 130, 246, 0.1); }
        .final-dl-btn { background: #10b981; color: white; padding: 10px; border-radius: 5px; text-decoration: none; display: inline-block; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h1>🎥 Pro Downloader</h1>
    <div class="social-icons">
        <i class="fab fa-youtube"></i> <i class="fab fa-instagram"></i> <i class="fab fa-facebook"></i>
    </div>
    
    <input type="text" id="videoUrl" placeholder="Paste link here...">
    <button class="btn" onclick="processVideo()">Get Download Links</button>

    <div id="resultArea">
        <p style="font-size: 14px;">✅ సర్వర్ సిద్ధంగా ఉంది!</p>
        <a id="downloadLink" href="#" class="final-dl-btn" target="_blank">Click to Download Video</a>
    </div>

    <p style="margin-top: 25px; font-size: 11px; opacity: 0.5;">Developed by Sathish Yadav</p>
</div>

<script>
    function processVideo() {
        let url = document.getElementById('videoUrl').value;
        let result = document.getElementById('resultArea');
        let dl = document.getElementById('downloadLink');

        if(!url) {
            alert("Please paste a link first!");
            return;
        }

        // సర్వర్ ని ఇక్కడే లింక్ చేస్తున్నాను. ఇది ఎప్పుడూ పని చేస్తుంది.
        // మేము ఇన్స్టాగ్రామ్, యూట్యూబ్ అన్నిటికీ పనిచేసే ఒక పవర్ ఫుల్ గేట్ వే వాడుతున్నాం.
        let serverUrl = "https://savefrom.net/?url=" + encodeURIComponent(url);
        
        dl.href = serverUrl;
        result.style.display = "block";
    }
</script>

</body>
</html>
