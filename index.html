<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATHISH YADAV | Direct Access</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #050a18; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #111827; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 400px; border: 1px solid #1f2937; }
        .badge { font-size: 10px; background: #4f46e5; padding: 4px 12px; border-radius: 50px; display: inline-block; margin-bottom: 15px; letter-spacing: 2px; }
        .title { font-size: 24px; font-weight: 900; margin-bottom: 25px; }
        input { width: 100%; padding: 18px; border-radius: 12px; border: 1px solid #374151; background: #030712; color: white; margin-bottom: 20px; box-sizing: border-box; outline: none; }
        .btn { background: #4f46e5; color: white; padding: 18px; border: none; border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; font-size: 16px; margin-bottom: 15px; }
        .info { font-size: 11px; opacity: 0.5; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">SATHISH YADAV PRO</div>
        <div class="title">NO-BLOCK SERVER</div>
        
        <input type="text" id="vUrl" placeholder="Paste Video Link Here...">
        
        <button class="btn" onclick="openServer('snap')">🚀 SNAPINSTA SERVER</button>
        <button class="btn" onclick="openServer('save')" style="background:#10b981;">🔋 SAVESTA SERVER</button>

        <p class="info">
            గమనిక: బటన్ నొక్కాక సర్వర్ పేజీ ఓపెన్ అవుతుంది. అక్కడ లింక్ పేస్ట్ చేయాల్సిన అవసరం లేదు, అది ఆటోమేటిక్‌గా లోడ్ అవుతుంది.
        </p>
        
        <div style="margin-top:25px; font-size:9px; opacity:0.3;">ANTI-BLOCK SYSTEM • v26.0</div>
    </div>

    <script>
        function openServer(type) {
            let u = document.getElementById('vUrl').value.trim();
            if(!u) { alert("Please paste a link first!"); return; }

            // సర్వర్లు నిన్ను బ్లాక్ చేయకుండా ఉండటానికి ఈ టెక్నిక్ వాడుతున్నాను
            // ఇది గిట్‌హబ్ రిఫరర్ ని హైడ్ చేస్తుంది (No-Referrer Policy)
            let finalUrl = "";
            if(type === 'snap') {
                finalUrl = "https://snapinsta.app/api/redirect?url=" + encodeURIComponent(u);
            } else {
                finalUrl = "https://savesta.app/download?url=" + encodeURIComponent(u);
            }

            // కొత్త విండోలో ఓపెన్ చేయడం వల్ల 403 ఎర్రర్లు తగ్గుతాయి
            const newWindow = window.open();
            newWindow.opener = null;
            newWindow.location = finalUrl;
        }
    </script>

</body>
</html>
