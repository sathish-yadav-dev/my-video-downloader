<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0b0f19; color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #161d2f; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 380px; border: 1px solid #2e3a59; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .name-badge { font-size: 11px; font-weight: bold; background: #4f46e5; padding: 4px 12px; border-radius: 50px; display: inline-block; margin-bottom: 15px; letter-spacing: 2px; text-transform: uppercase; }
        .social-icons { font-size: 22px; margin-bottom: 12px; display: flex; justify-content: center; gap: 20px; }
        .fa-instagram { color: #e1306c; } .fa-youtube { color: #ff0000; }
        
        .title { font-size: 24px; font-weight: 900; color: #fff; margin-bottom: 30px; letter-spacing: 1px; }

        input { width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #2e3a59; background: #0b0f19; color: white; margin-bottom: 25px; box-sizing: border-box; font-size: 15px; outline: none; }
        .main-btn { background: linear-gradient(45deg, #4f46e5, #3b82f6); color: white; padding: 18px; border: none; border-radius: 12px; width: 100%; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3); }
        .main-btn:active { transform: scale(0.96); }
        
        .footer { margin-top: 30px; font-size: 10px; color: #94a3b8; opacity: 0.4; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="card">

            <i class="fab fa-youtube"></i>

        <div class="title">PRO DOWNLOADER</div>
        
        <input type="text" id="vUrl" placeholder="Paste Video/Audio Link Here...">
        
        <button class="main-btn" onclick="openMagicServer()">
            <i class="fas fa-bolt"></i> QUICK DOWNLOAD
        </button>
        
        <div class="footer">SATHISH SERVER v12.0 • FASTEST</div>

    <script>
        function openMagicServer() {
            let u = document.getElementById('vUrl').value.trim();
            if(!u) { alert("Please paste a link first!"); return; }

            // ఇది కోబాల్ట్ సర్వర్ యొక్క డైరెక్ట్ లింక్ ట్రిక్

            let finalUrl = "https://cobalt.tools/?url=" + encodeURIComponent(u);
            
            window.location.href = finalUrl;
        }
    </script>
