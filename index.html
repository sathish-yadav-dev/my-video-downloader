<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATHISH YADAV | Pro Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0b1120; color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid #334155; }
        
        /* బ్రాండింగ్ స్టైల్ */
        .name-badge { font-size: 12px; font-weight: 800; background: #4f46e5; padding: 5px 15px; border-radius: 50px; display: inline-block; margin-bottom: 15px; letter-spacing: 2px; }
        .social-icons { font-size: 20px; margin-bottom: 10px; display: flex; justify-content: center; gap: 15px; }
        .fa-instagram { color: #e1306c; } .fa-youtube { color: #ff0000; }
        .title { font-size: 22px; font-weight: 900; color: #818cf8; margin-bottom: 25px; }

        .input-box { width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: white; margin-bottom: 20px; box-sizing: border-box; font-size: 14px; outline: none; }
        .gen-btn { background: #4f46e5; color: white; padding: 16px; border: none; border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; font-size: 16px; }
        
        /* ఫలితం చూపించే ఏరియా */
        #download-box { display: none; margin-top: 25px; padding: 20px; background: #0f172a; border-radius: 15px; border: 1px solid #4f46e5; animation: slideUp 0.5s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .final-dl-btn { background: #10b981; color: white; padding: 14px 25px; border-radius: 10px; text-decoration: none; font-weight: bold; display: block; margin-top: 15px; box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4); }
    </style>
</head>
<body>

    <div class="card">
        <div class="name-badge">SATHISH YADAV</div>
        <div class="social-icons">
            <i class="fab fa-instagram"></i> <i class="fab fa-youtube"></i>
        </div>
        <div class="title">PRO DOWNLOADER</div>
        
        <input type="text" id="vUrl" class="input-box" placeholder="Paste link here...">
        <button class="gen-btn" onclick="processVideo()">GENERATE DOWNLOAD</button>

        <div id="download-box">
            <p style="color: #10b981; margin: 0; font-size: 14px; font-weight: bold;">✅ Ready to Download!</p>
            <div id="btn-container"></div>
        </div>

        <div style="margin-top: 30px; font-size: 10px; opacity: 0.4;">SATHISH SERVER v7.0 • FIXED</div>
    </div>

    <script>
        function processVideo() {
            let url = document.getElementById('vUrl').value.trim();
            if(!url) { alert("Please paste a link!"); return; }

            let box = document.getElementById('download-box');
            let container = document.getElementById('btn-container');
            
            box.style.display = "block";
            container.innerHTML = "<p style='font-size:12px; margin-top:10px;'>Fetching secure link...</p>";

            // స్మార్ట్ ట్రిక్: ఇది యూజర్ ని నేరుగా డౌన్లోడ్ మోడ్ లోకి తీసుకెళ్తుంది
            // ఇది ఏ మొబైల్ లో అయినా బటన్ ని క్లియర్ గా చూపిస్తుంది
            setTimeout(() => {
                let dlUrl = "https://ddownloader.com/inspect?url=" + encodeURIComponent(url);
                container.innerHTML = `<a href="${dlUrl}" target="_blank" class="final-dl-btn">📥 CLICK TO DOWNLOAD VIDEO</a>`;
            }, 1000);
        }
    </script>

</body>
</html>
