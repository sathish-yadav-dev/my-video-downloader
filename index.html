<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATHISH YADAV | High Speed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0b0f19; color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #161d2f; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 380px; border: 1px solid #2e3a59; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .name-badge { font-size: 11px; font-weight: 800; background: #4f46e5; padding: 5px 12px; border-radius: 50px; display: inline-block; margin-bottom: 15px; letter-spacing: 2px; }
        .title { font-size: 22px; font-weight: 900; margin-bottom: 25px; color: #fff; }
        input { width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #2e3a59; background: #0b0f19; color: white; margin-bottom: 20px; box-sizing: border-box; font-size: 14px; outline: none; }
        
        /* హై స్పీడ్ బటన్ */
        .fast-btn { background: linear-gradient(45deg, #00dbde, #fc00ff); color: white; padding: 18px; border: none; border-radius: 15px; width: 100%; font-weight: bold; cursor: pointer; font-size: 16px; box-shadow: 0 5px 15px rgba(0, 219, 222, 0.4); }
        .fast-btn:active { transform: scale(0.95); }
        
        #speed-box { display: none; margin-top: 25px; padding: 15px; border-radius: 15px; background: rgba(255, 255, 255, 0.05); border: 1px solid #4f46e5; }
        .download-link { background: #10b981; color: white; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; display: block; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="name-badge">SATHISH YADAV PRO</div>
        <div class="title">HIGH-SPEED SERVER</div>
        
        <input type="text" id="vLink" placeholder="Paste Video Link Here...">
        <button class="fast-btn" onclick="fetchInstant()">⚡ INSTANT DOWNLOAD</button>

        <div id="speed-box">
            <p style="margin:0; font-size:13px; color:#00dbde;">🚀 Link Generated in 0.5s!</p>
            <div id="btn-here"></div>
        </div>

        <div style="margin-top:25px; font-size:10px; opacity:0.3;">SUPERFAST CDN • v27.0</div>
    </div>

    <script>
        function fetchInstant() {
            let u = document.getElementById('vLink').value.trim();
            if(!u) { alert("Paste a link first!"); return; }

            document.getElementById('speed-box').style.display = "block";
            let container = document.getElementById('btn-here');
            
            // సర్వర్ల జాప్యం లేకుండా నేరుగా ఎక్స్‌ప్రెస్ గేట్‌వే ని వాడుతున్నాం
            // ఇది లోడ్ అవ్వడానికి అసలు టైమ్ తీసుకోదు
            let expressUrl = "https://ddownloader.com/api/analyze?url=" + encodeURIComponent(u);
            
            // ఈ గేట్‌వే ద్వారా నేరుగా గ్యాలరీ కి సేవ్ అవుతుంది
            let galleryLink = "https://save-from.net/?url=" + u;

            container.innerHTML = `<a href="${galleryLink}" target="_blank" class="download-link">📥 SAVE TO GALLERY NOW</a>`;
        }
    </script>

</body>
</html>
