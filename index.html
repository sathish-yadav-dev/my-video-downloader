<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sathish Yadav - Pro Downloader</title>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            padding: 20px;
            width: 100%;
        }
        .container {
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 500px;
            margin-bottom: 20px;
        }
        .brand-name {
            background: #4f46e5;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }
        h1 { color: #818cf8; margin: 10px 0; font-size: 24px; }
        input {
            width: 100%;
            padding: 15px;
            margin: 20px 0;
            border-radius: 10px;
            border: 2px solid #334155;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: #818cf8; }
        button {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4); }
        
        /* Iframe styling */
        #downloadArea {
            display: none;
            width: 95%;
            max-width: 800px;
            height: 600px;
            border: 2px solid #334155;
            border-radius: 15px;
            overflow: hidden;
            background: white;
            margin-top: 20px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-name">SATHISH YADAV</div>
        <h1>PRO DOWNLOADER</h1>
    </div>

    <div class="container" id="mainInput">
        <input type="text" id="vUrl" placeholder="Paste Video Link Here...">
        <button onclick="processDownload()">⚡ DOWNLOAD NOW</button>
        <p style="font-size: 12px; color: #94a3b8; margin-top: 15px;">SATHISH SERVER v4.0 • FAST & SECURE</p>
    </div>

    <div id="downloadArea">
        <div style="background: #1e293b; padding: 10px; text-align: center; border-bottom: 1px solid #334155;">
            <span style="color: #818cf8; font-weight: bold;">SATHISH YADAV - Processing Your Video...</span>
        </div>
        <iframe id="dlFrame" src=""></iframe>
    </div>

    <script>
        function processDownload() {
            const u = document.getElementById('vUrl').value.trim();
            if (!u) {
                alert("Please paste a link first!");
                return;
            }

            // పబ్లర్ కి లింక్ ని పారామీటర్ గా పంపుతున్నాం
            const finalServer = "https://publer.io/tools/media-downloader?url=" + encodeURIComponent(u);
            
            // UI మార్పులు
            document.getElementById('downloadArea').style.display = 'block';
            document.getElementById('dlFrame').src = finalServer;
            
            // ఆటోమేటిక్ గా కిందికి స్క్రోల్ చేస్తుంది
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>
</html>
