<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATHISH YADAV | Pro Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0b0f19; color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #161d2f; padding: 35px; border-radius: 25px; text-align: center; width: 88%; max-width: 380px; border: 1px solid #2e3a59; box-shadow: 0 15px 40px rgba(0,0,0,0.6); }
        
        /* చిన్నగా కానీ అదిరిపోయేలా హైలైట్ అయ్యే పేరు */
        .name-badge { 
            font-size: 11px; 
            font-weight: 800; 
            letter-spacing: 2.5px; 
            color: #fff; 
            background: linear-gradient(45deg, #4f46e5, #3b82f6);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 50px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        
        .social-icons { font-size: 20px; margin-bottom: 10px; display: flex; justify-content: center; gap: 20px; }
        .fa-instagram { color: #e1306c; }
        .fa-youtube { color: #ff0000; }
        
        .title-text { 
            font-size: 24px; 
            font-weight: 900; 
            color: #fff;
            margin-bottom: 30px; 
            text-transform: uppercase;
        }

        input { width: 100%; padding: 18px; border-radius: 12px; border: 2px solid #2e3a59; background: #0b0f19; color: white; margin-bottom: 25px; box-sizing: border-box; font-size: 15px; outline: none; }
        
        .main-btn { 
            background: #4f46e5; 
            color: white; 
            padding: 18px; 
            border: none; 
            border-radius: 12px; 
            width: 100%; 
            font-weight: bold; 
            font-size: 17px; 
            cursor: pointer; 
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }
        .main-btn:active { transform: scale(0.96); }
        
        .footer { margin-top: 30px; font-size: 10px; color: #94a3b8; opacity: 0.5; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="name-badge">SATHISH YADAV</div>
        
        <div class="social-icons">
            <i class="fab fa-instagram"></i>
            <i class="fab fa-youtube"></i>
        </div>
        
        <div class="title-text">PRO DOWNLOADER</div>
        
        <input type="text" id="videoLink" placeholder="Paste Video Link Here...">
        
        <button class="main-btn" onclick="openSnap()">
            <i class="fas fa-bolt"></i> DOWNLOAD NOW
        </button>
        
        <div class="footer">STABLE SERVER • SATHISH v15.0</div>
    </div>

    <script>
        function openSnap() {
            let u = document.getElementById('videoLink').value.trim();
            if(!u) { alert("Please paste a link first!"); return; }
            
            // SnapSave - ఇది SnapInsta లాంటిదే, చాలా వేగంగా ఉంటుంది
            // ఇది యూజర్ మళ్ళీ పేస్ట్ చేసే పని లేకుండా నేరుగా లింక్ తీసుకుంటుంది
            let finalUrl = "https://snapsave.app/?url=" + encodeURIComponent(u);
            
            // నేరుగా అదే పేజీలో ఓపెన్ అవుతుంది
            window.location.href = finalUrl;
        }
    </script>

</body>
</html>
