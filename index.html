<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATHISH YADAV | Direct Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 380px; border: 1px solid #334155; }
        
        .name-badge { font-size: 12px; font-weight: bold; background: #4f46e5; padding: 5px 15px; border-radius: 50px; display: inline-block; margin-bottom: 10px; text-transform: uppercase; }
        .social-icons { font-size: 20px; margin-bottom: 10px; display: flex; justify-content: center; gap: 15px; }
        .fa-instagram { color: #e1306c; } .fa-youtube { color: #ff0000; }
        .title { font-size: 20px; font-weight: 900; color: #818cf8; margin-bottom: 25px; }

        input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 20px; box-sizing: border-box; }
        .btn { background: #4f46e5; color: white; padding: 15px; border: none; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; }
        .footer { margin-top: 20px; font-size: 10px; opacity: 0.4; }
    </style>
</head>
<body>

    <div class="card">
        <div class="name-badge">SATHISH YADAV</div>
        <div class="social-icons">
            <i class="fab fa-instagram"></i> <i class="fab fa-youtube"></i>
        </div>
        <div class="title">PRO DOWNLOADER</div>
        
        <input type="text" id="linkInput" placeholder="Paste link here...">
        <button class="btn" onclick="downloadNow()">DOWNLOAD NOW</button>
        
        <div class="footer">STABLE SERVER • 2026</div>
    </div>

    <script>
        function downloadNow() {
            let url = document.getElementById('linkInput').value.trim();
            if(!url) { alert("Please paste a link!"); return; }

            // ఇది ప్రపంచంలోనే అత్యంత నమ్మకమైన 'sfrom.net' ట్రిక్. 
            // ఇది లింక్ ని డైరెక్ట్ గా సర్వర్ కి కనెక్ట్ చేస్తుంది.
            let finalUrl = "https://sfrom.net/" + url;
            window.open(finalUrl, "_blank");
        }
    </script>

</body>
</html>
