<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATHISH YADAV | Pro Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0b1120; color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid #334155; }
        
        /* చిన్నగా అదిరిపోయే బ్రాండింగ్ */
        .name-badge { font-size: 10px; font-weight: 800; background: linear-gradient(45deg, #4f46e5, #7c3aed); padding: 5px 15px; border-radius: 50px; display: inline-block; margin-bottom: 12px; letter-spacing: 2px; text-transform: uppercase; box-shadow: 0 4px 15px rgba(79, 102, 241, 0.4); }
        .social-icons { font-size: 20px; margin-bottom: 10px; display: flex; justify-content: center; gap: 15px; }
        .fa-instagram { color: #e1306c; } .fa-youtube { color: #ff0000; }
        .title { font-size: 24px; font-weight: 900; color: #fff; margin-bottom: 30px; letter-spacing: 1px; }

        input { width: 100%; padding: 18px; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: white; margin-bottom: 25px; box-sizing: border-box; font-size: 15px; outline: none; transition: 0.3s; }
        input:focus { border-color: #4f46e5; }

        .gen-btn { background: #4f46e5; color: white; padding: 18px; border: none; border-radius: 15px; width: 100%; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3); }
        .gen-btn:active { transform: scale(0.96); }

        #status-box { display: none; margin-top: 25px; padding: 20px; background: rgba(16, 185, 129, 0.1); border-radius: 15px; border: 1px dashed #10b981; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .dl-final { background: #10b981; color: white; padding: 14px; border-radius: 10px; text-decoration: none; font-weight: bold; display: block; margin-top: 15px; font-size: 14px; box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3); }
    </style>
</head>
<body>

    <div class="card">
        <div class="name-badge">SATHISH YADAV</div>
        <div class="social-icons">
            <i class="fab fa-instagram"></i> <i class="fab fa-youtube"></i>
        </div>
        <div class="title">PRO DOWNLOADER</div>
        
        <input type="text" id="vLink" placeholder="Paste Instagram/YouTube link...">
        <button class="gen-btn" onclick="start()">🚀 DOWNLOAD VIDEO</button>

        <div id="status-box">
            <p style="color: #10b981; margin: 0; font-size: 14px; font-weight: bold;">✨ Processing Done!</p>
            <p style="font-size: 12px; margin: 5px 0; opacity: 0.7;">Click the button below to save to gallery:</p>
            <div id="btn-container"></div>
        </div>

        <div style="margin-top: 35px; font-size: 10px; opacity: 0.3; letter-spacing: 1px;">SATHISH SECURE SERVER • v18.0 • STABLE</div>
    </div>

    <script>
        function start() {
            let u = document.getElementById('vLink').value.trim();
            if(!u) { alert("Please paste a link first!"); return; }

            document.getElementById('status-box').style.display = "block";
            let container = document.getElementById('btn-container');
            container.innerHTML = "<p style='font-size:12px;'>Generating high-speed link...</p>";

            // 403 Forbidden ఎర్రర్ రాకుండా ఉండటానికి 'sfrom.net' ట్రిక్ వాడుతున్నాం
            // ఇది యూజర్ ని కన్ఫ్యూజ్ చేయకుండా నేరుగా వీడియోని లోడ్ చేస్తుంది
            setTimeout(() => {
                let finalUrl = "https://sfrom.net/" + u;
                container.innerHTML = `<a href="${finalUrl}" target="_blank" class="dl-final">📥 SAVE TO GALLERY</a>`;
            }, 1200);
        }
    </script>

</body>
</html>
