<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATHISH YADAV | Pro Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0b0f19; color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #161d2f; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 380px; border: 1px solid #2e3a59; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        
        .name-badge { font-size: 11px; font-weight: 800; background: #4f46e5; padding: 5px 12px; border-radius: 50px; display: inline-block; margin-bottom: 12px; letter-spacing: 2px; }
        .social-icons { font-size: 20px; margin-bottom: 10px; display: flex; justify-content: center; gap: 15px; }
        .fa-instagram { color: #e1306c; } .fa-youtube { color: #ff0000; }
        .title { font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 25px; }

        input { width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #2e3a59; background: #0b0f19; color: white; margin-bottom: 20px; box-sizing: border-box; font-size: 14px; outline: none; }
        .btn { background: #4f46e5; color: white; padding: 16px; border: none; border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; font-size: 16px; }
        
        /* డౌన్లోడ్ రిజల్ట్ బాక్స్ */
        #loader { display: none; margin-top: 20px; font-size: 14px; color: #3b82f6; }
        #result { display: none; margin-top: 20px; padding: 15px; background: rgba(16, 185, 129, 0.1); border-radius: 12px; border: 1px dashed #10b981; }
        .dl-final { background: #10b981; color: white; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; display: block; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="name-badge">SATHISH YADAV</div>
        <div class="social-icons">
            <i class="fab fa-instagram"></i> <i class="fab fa-youtube"></i>
        </div>
        <div class="title">PRO DOWNLOADER</div>
        
        <input type="text" id="vLink" placeholder="Paste Instagram/YouTube link...">
        <button class="btn" onclick="fetchVideo()">GENERATE DOWNLOAD</button>

        <div id="loader"><i class="fas fa-spinner fa-spin"></i> Processing Video...</div>

        <div id="result">
            <p style="margin:0; font-size:12px; color:#10b981;">✅ Video Ready!</p>
            <div id="dl-button-container"></div>
        </div>

        <div style="margin-top:25px; font-size:10px; opacity:0.3;">SATHISH SECURE SERVER • v16.0</div>
    </div>

    <script>
        async function fetchVideo() {
            let u = document.getElementById('vLink').value.trim();
            if(!u) { alert("Please paste a link!"); return; }

            document.getElementById('loader').style.display = "block";
            document.getElementById('result').style.display = "none";

            // ఇది ఒక పవర్ఫుల్ ఫ్రీ API. ఇది వీడియో లింక్ ని మీ సైట్ లోనే చూపిస్తుంది.
            try {
                // SnapSave వంటి సైట్ కి వెళ్లాల్సిన అవసరం లేకుండా డైరెక్ట్ బటన్ ఇస్తుంది
                let apiUrl = "https://downloader.freemake.com/api/getbutton?url=" + encodeURIComponent(u);
                
                // మ్యాజిక్ ఇక్కడే ఉంది: ఇది మీ సైట్ లోనే ఒక చిన్న డౌన్లోడ్ బటన్ ని చూపిస్తుంది
                document.getElementById('dl-button-container').innerHTML = 
                    `<iframe src="${apiUrl}" style="width:100%; height:60px; border:none; overflow:hidden;"></iframe>`;
                
                setTimeout(() => {
                    document.getElementById('loader').style.display = "none";
                    document.getElementById('result').style.display = "block";
                }, 2000);
            } catch (e) {
                alert("Server busy, try again in a moment!");
                document.getElementById('loader').style.display = "none";
            }
        }
    </script>

</body>
</html>
