<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATHISH YADAV | Pro Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 25px; text-align: center; width: 85%; max-width: 380px; border: 1px solid #334155; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        /* చిన్నగా మరియు హైలైట్ అయ్యే బ్రాండింగ్ */
        .name-brand { 
            font-size: 13px; 
            font-weight: 800; 
            letter-spacing: 2px; 
            color: #fff; 
            background: linear-gradient(45deg, #4f46e5, #3b82f6);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 50px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        
        .social-icons { font-size: 22px; margin-bottom: 12px; display: flex; justify-content: center; gap: 20px; }
        .fa-instagram { color: #e1306c; }
        .fa-youtube { color: #ff0000; }
        
        .downloader-text { font-size: 22px; font-weight: 900; color: #818cf8; margin-bottom: 25px; }

        input { width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: white; margin-bottom: 20px; box-sizing: border-box; font-size: 15px; outline: none; }
        
        .main-btn { 
            background: #4f46e5; 
            color: white; 
            padding: 16px; 
            border: none; 
            border-radius: 12px; 
            width: 100%; 
            font-weight: bold; 
            font-size: 17px; 
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }
        .main-btn:active { transform: scale(0.95); }
        .footer { margin-top: 25px; font-size: 10px; color: #94a3b8; opacity: 0.5; }
    </style>
</head>
<body>

    <div class="card">
        <div class="name-brand">SATHISH YADAV</div>
        
        <div class="social-icons">
            <i class="fab fa-instagram"></i>
            <i class="fab fa-youtube"></i>
        </div>
        
        <div class="downloader-text">PRO DOWNLOADER</div>
        
        <input type="text" id="videoUrl" placeholder="Paste link here...">
        
        <button class="main-btn" onclick="transferLink()">
            <i class="fas fa-bolt"></i> GET DOWNLOAD LINK
        </button>
        
        <div class="footer">SATHISH SERVER v5.0 • NO RE-PASTE</div>
    </div>

    <script>
        function transferLink() {
            let u = document.getElementById('videoUrl').value.trim();
            if(!u) { alert("Please paste a link first!"); return; }
            
            // SaveFrom మ్యాజిక్ ట్రిక్ - ఇది యూజర్ పేస్ట్ చేయకుండానే లింక్ ని రీడ్ చేస్తుంది
            let sUrl = "https://savefrom.net/?url=" + encodeURIComponent(u);
            window.location.href = sUrl;
        }
    </script>

</body>
</html>
