<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sathish Pro Downloader v3</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0b0f19; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #161d2f; padding: 30px; border-radius: 25px; text-align: center; width: 90%; max-width: 380px; border: 1px solid #2e3a59; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #6366f1; font-size: 24px; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #2e3a59; background: #0b0f19; color: white; margin: 20px 0; box-sizing: border-box; font-size: 16px; outline: none; }
        .btn { background: #6366f1; color: white; padding: 16px; border-radius: 12px; text-decoration: none; font-weight: bold; display: block; font-size: 18px; transition: 0.3s; border: none; width: 100%; cursor: pointer; }
        #status { margin-top: 15px; font-size: 13px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Sathish's Server</h1>
        <p style="opacity:0.6; font-size:12px;">No Ads • High Speed • Unlimited</p>
        
        <input type="text" id="vUrl" placeholder="Paste link (Insta, YT, FB)...">
        
        <button onclick="startDownload()" class="btn">Download Now</button>
        
        <div id="status">Ready to process link</div>
        <p style="margin-top: 25px; font-size: 10px; opacity: 0.3;">© 2026 Powered by Sathish Server</p>
    </div>

    <script>
        function startDownload() {
            let url = document.getElementById('vUrl').value;
            let status = document.getElementById('status');
            
            if(!url) {
                alert("Please paste a video link!");
                return;
            }

            status.innerText = "⏳ Connecting to Server...";
            status.style.color = "#6366f1";

            // Cobalt - ఇది ప్రపంచంలోనే బెస్ట్ అడ్వర్టైజ్మెంట్ లేని డౌన్లోడర్ సర్వర్
            // ఇది ఏ బ్రౌజర్ లో అయినా బ్లాక్ అవ్వకుండా పనిచేస్తుంది
            let server = "https://cobalt.tools/?url=" + encodeURIComponent(url);
            
            // రీడైరెక్ట్ కాకుండా కొత్త ట్యాబ్ లో కాకుండా అదే పేజీలో పక్కాగా లోడ్ చేస్తుంది
            window.location.href = server;
        }
    </script>
</body>
</html>
