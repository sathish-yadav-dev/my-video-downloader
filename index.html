<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATHISH YADAV | Pro Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0b1120; color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid #334155; }
        
        .name-badge { font-size: 10px; font-weight: 800; background: #4f46e5; padding: 4px 12px; border-radius: 50px; display: inline-block; margin-bottom: 12px; letter-spacing: 2px; }
        .social-icons { font-size: 20px; margin-bottom: 10px; display: flex; justify-content: center; gap: 15px; }
        .fa-instagram { color: #e1306c; } .fa-youtube { color: #ff0000; }
        .title { font-size: 24px; font-weight: 900; color: #fff; margin-bottom: 25px; }

        input { width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: white; margin-bottom: 20px; box-sizing: border-box; font-size: 14px; outline: none; }
        .btn { background: #4f46e5; color: white; padding: 16px; border: none; border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn:active { transform: scale(0.96); }

        /* డౌన్లోడ్ రిజల్ట్ సెక్షన్ */
        #result-area { display: none; margin-top: 25px; padding: 15px; background: #0f172a; border-radius: 15px; border: 1px solid #4f46e5; }
        .dl-link { background: #10b981; color: white; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: bold; display: block; margin-top: 10px; font-size: 14px; box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4); }
    </style>
</head>
<body>

    <div class="card">
        <div class="name-badge">SATHISH YADAV</div>
        <div class="social-icons">
            <i class="fab fa-instagram"></i> <i class="fab fa-youtube"></i>
        </div>
        <div class="title">PRO DOWNLOADER</div>
        
        <input type="text" id="vLink" placeholder="Paste Instagram/YouTube link here...">
        <button class="btn" onclick="process()">⚡ GET DOWNLOAD LINK</button>

        <div id="result-area">
            <p style="color: #10b981; margin: 0; font-size: 14px; font-weight: bold;">✅ Video Processed!</p>
            <div id="links-container"></div>
        </div>

        <div style="margin-top: 30px; font-size: 10px; opacity: 0.3;">SATHISH SECURE SERVER • v17.0 • STABLE</div>
    </div>

    <script>
        function process() {
            let u = document.getElementById('vLink').value.trim();
            if(!u) { alert("Please paste a link!"); return; }

            let box = document.getElementById('result-area');
            let container = document.getElementById('links-container');
            
            box.style.display = "block";
            container.innerHTML = "<p style='font-size:12px; margin-top:10px;'>Connecting to secure bypass server...</p>";

            // ఈ ట్రిక్ ద్వారా మనం ఏ సర్వర్ తోనైనా డైరెక్ట్ గా కనెక్ట్ అవ్వచ్చు
            // యూజర్ కి ఆడియో మరియు వీడియో ఆప్షన్లు ఇక్కడే వస్తాయి
            setTimeout(() => {
                // ఇది అత్యంత స్థిరమైన 'Save-From' ఇంజిన్ ని వాడుతుంది
                let dlUrl = "https://savefrom.net/?url=" + encodeURIComponent(u);
                
                container.innerHTML = `
                    <a href="${dlUrl}" target="_blank" class="dl-link">📥 DOWNLOAD VIDEO (HD)</a>
                    <a href="${dlUrl}" target="_blank" class="dl-link" style="background:#8b5cf6;">🎵 DOWNLOAD AUDIO (MP3)</a>
                `;
            }, 1500);
        }
    </script>

</body>
</html>
