<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATHISH YADAV | Pro Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 380px; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .name-badge { font-size: 11px; font-weight: bold; background: #4f46e5; padding: 4px 12px; border-radius: 50px; display: inline-block; margin-bottom: 10px; text-transform: uppercase; }
        .social-icons { font-size: 20px; margin-bottom: 10px; display: flex; justify-content: center; gap: 15px; }
        .fa-instagram { color: #e1306c; } .fa-youtube { color: #ff0000; }
        .title { font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 25px; }
        input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 20px; box-sizing: border-box; outline: none; }
        .btn { background: #4f46e5; color: white; padding: 16px; border: none; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; font-size: 16px; }
        .footer { margin-top: 25px; font-size: 10px; opacity: 0.4; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="name-badge">SATHISH YADAV</div>
        <div class="social-icons">
            <i class="fab fa-instagram"></i> <i class="fab fa-youtube"></i>
        </div>
        <div class="title">PRO DOWNLOADER</div>
        
        <input type="text" id="vUrl" placeholder="Paste link here...">
        <button class="btn" onclick="openServer()">🚀 GENERATE DOWNLOAD LINK</button>
        
        <div class="footer">SATHISH SERVER v11.0 • AUTO-FETCH</div>
    </div>

    <script>
        function openServer() {
            let u = document.getElementById('vUrl').value.trim();
            if(!u) { alert("Please paste a link!"); return; }

            // ఈ ట్రిక్ ద్వారా యూజర్ మళ్ళీ పేస్ట్ చేయాల్సిన అవసరం ఉండదు
            // ఇది డైరెక్ట్ గా డౌన్లోడ్ ఆప్షన్ల పేజీకి తీసుకెళ్తుంది
            let finalUrl = "https://www.y2mate.com/inspect?url=" + encodeURIComponent(u);
            
            // ఫోన్ లో చాలా స్పీడ్ గా ఓపెన్ అవుతుంది
            window.location.replace(finalUrl);
        }
    </script>

</body>
</html>
