<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATHISH YADAV | Ultimate Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0b0f19; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow-x: hidden; }
        .card { background: #161d2f; padding: 25px; border-radius: 20px; text-align: center; width: 95%; max-width: 400px; border: 1px solid #2e3a59; }
        .badge { font-size: 10px; background: #4f46e5; padding: 4px 12px; border-radius: 50px; display: inline-block; margin-bottom: 10px; letter-spacing: 2px; }
        .title { font-size: 20px; font-weight: 900; margin-bottom: 20px; color: #fff; }
        
        /* మ్యాజిక్ ఇక్కడే ఉంది */
        #server-container { display: none; margin-top: 20px; width: 100%; height: 500px; border-radius: 15px; overflow: hidden; border: 2px solid #4f46e5; background: white; }
        iframe { width: 100%; height: 100%; border: none; }

        .btn { background: #4f46e5; color: white; padding: 15px; border: none; border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">SATHISH YADAV PRO</div>
        <div class="title">ULTIMATE SERVER v25.0</div>
        
        <p style="font-size: 12px; color: #94a3b8; margin-bottom: 20px;">
            ఏ వెబ్‌సైట్ కి వెళ్లకుండా ఇక్కడే డౌన్‌లోడ్ చేసుకోండి.
        </p>

        <button class="btn" onclick="activateServer()">
            <i class="fas fa-plug"></i> ACTIVATE PRIVATE SERVER
        </button>

        <div id="server-container">
            <iframe id="dlFrame" src=""></iframe>
        </div>

        <div style="margin-top:20px; font-size:9px; opacity:0.3;">NO REDIRECTS • DIRECT GALLERY SAVE</div>
    </div>

    <script>
        function activateServer() {
            const container = document.getElementById('server-container');
            const frame = document.getElementById('dlFrame');
            
            // SnapInsta అఫీషియల్ ఇంజిన్ ని నీ సైట్ లోకి లోడ్ చేస్తున్నాను
            frame.src = "https://snapinsta.app/#download";
            container.style.display = "block";
            
            // బటన్ ని హైడ్ చేస్తున్నాను
            document.querySelector('.btn').style.display = "none";
        }
    </script>

</body>
</html>
