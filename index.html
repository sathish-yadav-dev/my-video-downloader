<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sathish Yadav - Video Downloader</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .card { background: #1e293b; padding: 40px; border-radius: 20px; width: 85%; max-width: 350px; border: 1px solid #334155; }
        h1 { color: #3b82f6; font-size: 22px; }
        input { width: 100%; padding: 15px; border-radius: 10px; border: 2px solid #334155; background: #0f172a; color: white; margin-bottom: 20px; box-sizing: border-box; }
        
        /* ఇది అసలైన మ్యాజిక్ లింక్ */
        .magic-link {
            display: block;
            background: #10b981;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎥 Pro Downloader</h1>
        <p style="font-size: 12px; opacity: 0.6;">Paste link below and click the green button</p>
        
        <form action="https://en.savefrom.net/" method="get" target="_self">
            <input type="text" name="url" placeholder="Paste Video Link Here..." required>
            <button type="submit" class="magic-link" style="width: 100%; border: none; cursor: pointer;">
                Download Now
            </button>
        </form>
        
        <p style="margin-top: 20px; font-size: 10px; opacity: 0.4;">Developed by Sathish Yadav</p>
    </div>

</body>
</html>
